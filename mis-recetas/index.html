<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#351714">
<title>Sabor Ligero — Mis recetas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--vino:#351714;--vino2:#5A2C27;--rojo:#B20404;--rojo2:#7A0202;--crema:#FFF8F1;--beige:#E3DBCE;--texto:#351714;--suave:#6B4A45}
*{box-sizing:border-box}
html,body{margin:0;background:var(--crema);color:var(--texto);font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{background:var(--vino);color:#fff;position:sticky;top:0;z-index:10;padding:env(safe-area-inset-top) 0 0}
header.top .bar{display:flex;align-items:center;gap:12px;height:60px}
.logo{font-family:'Titan One',sans-serif;font-size:22px;letter-spacing:.3px;line-height:1}
.logo small{display:block;font-family:Poppins,sans-serif;font-size:11px;font-weight:500;letter-spacing:1.5px;opacity:.8;margin-top:2px}
.back{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.spacer{flex:1}
.favbtn{height:44px;padding:0 14px;border-radius:22px;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.hero{background:var(--vino);color:#fff;padding:8px 0 28px;border-radius:0 0 28px 28px}
.hero h1{font-family:'Titan One',sans-serif;font-weight:400;font-size:30px;line-height:1.1;margin:8px 0 6px}
.hero p{margin:0 0 18px;opacity:.85;font-size:15px}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:0 14px;height:52px}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:16px;color:var(--texto);background:transparent;min-width:0}
.search svg{flex-shrink:0;color:var(--suave)}
.sec{margin:28px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2{font-family:'Titan One',sans-serif;font-weight:400;font-size:22px;margin:0}
.sec span{font-size:13px;color:var(--suave)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cat{position:relative;border-radius:22px;overflow:hidden;background:var(--vino2);aspect-ratio:1/1.05;display:block;color:#fff}
.cat img{width:100%;height:100%;object-fit:cover;display:block}
.cat .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(53,23,20,.92) 0%,rgba(53,23,20,.2) 55%,rgba(53,23,20,0) 75%)}
.cat .lbl{position:absolute;left:14px;right:14px;bottom:12px}
.cat .lbl b{display:block;font-family:'Titan One',sans-serif;font-weight:400;font-size:21px;line-height:1.1}
.cat .lbl i{font-style:normal;font-size:12px;opacity:.9}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:40px;padding:0 16px;border-radius:20px;border:2px solid var(--vino);background:#fff;color:var(--vino);font-size:14px;font-weight:600;display:flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--vino);color:#fff}
.list{display:flex;flex-direction:column;gap:10px;margin-bottom:40px}
.card{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:10px;border:1.5px solid #EDE3D6}
.thumb{width:72px;height:72px;border-radius:14px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:'Titan One',sans-serif;font-size:26px;color:#fff}
.thumb img{width:100%;height:100%;object-fit:cover}
.t-desayunos{background:#C9762E}.t-almuerzos{background:#3F7A3A}.t-meriendas{background:#B4466B}.t-cenas{background:#2F5E8A}
.card .info{flex:1;min-width:0}
.card .info b{display:block;font-weight:600;font-size:15px;line-height:1.25;color:var(--vino)}
.meta{display:flex;gap:12px;margin-top:5px;font-size:12.5px;color:var(--suave);flex-wrap:wrap}
.meta span{display:inline-flex;align-items:center;gap:4px}
.heart{width:44px;height:44px;border:0;background:transparent;color:var(--rojo);display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%}
.empty{text-align:center;padding:40px 16px;color:var(--suave)}
.rhero{background:var(--vino);color:#fff;padding:0 0 24px;border-radius:0 0 28px 28px}
.rhero .img{width:100%;max-height:300px;aspect-ratio:16/10;object-fit:cover;display:block;border-radius:0 0 0 0}
.rhero .noimg{height:120px;display:flex;align-items:center;justify-content:center;font-family:'Titan One',sans-serif;font-size:56px;opacity:.95}
.tag{display:inline-block;background:var(--rojo);color:#fff;font-size:12px;font-weight:600;letter-spacing:1px;padding:5px 12px;border-radius:12px;margin-top:18px}
.rhero h1{font-family:'Titan One',sans-serif;font-weight:400;font-size:28px;line-height:1.1;margin:10px 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:rgba(255,255,255,.1);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:700}
.stat span{font-size:12px;opacity:.85}
.block{background:#fff;border-radius:22px;padding:18px;margin-top:16px;border:1.5px solid #EDE3D6}
.block h2{font-family:'Titan One',sans-serif;font-weight:400;font-size:20px;margin:0 0 12px;color:var(--rojo)}
.ing{list-style:none;margin:0;padding:0}
.ing li{border-bottom:1px solid #F1E8DD}
.ing li:last-child{border-bottom:0}
.ing label{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;font-size:15.5px;line-height:1.4;cursor:pointer}
.ing input{width:22px;height:22px;margin:0;accent-color:var(--rojo);flex-shrink:0;margin-top:1px}
.ing input:checked+span{text-decoration:line-through;color:#A08C88}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:flex;gap:12px;padding:10px 0;font-size:15.5px;line-height:1.5}
.steps li::before{counter-increment:s;content:counter(s);flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--vino);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.note{font-size:12.5px;color:var(--suave);margin:14px 4px 40px;line-height:1.5}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;height:50px;border-radius:25px;border:0;background:var(--rojo);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 var(--rojo2)}
.btn.sec2{background:#fff;color:var(--vino);border:2px solid var(--vino);box-shadow:none}
.welcome{background:#fff;border-radius:22px;padding:16px 18px;margin-top:18px;border:1.5px solid #EDE3D6;font-size:14px;line-height:1.5}
.welcome b{color:var(--rojo)}
footer{text-align:center;font-size:12px;color:var(--suave);padding:20px 16px 40px}
@media (min-width:640px){.cats{grid-template-columns:repeat(4,minmax(0,1fr))}.hero h1{font-size:36px}}
@media print{header.top,.actions,.heart,.favbtn,.back{display:none!important}.rhero{background:#fff;color:#000}.block{border:0}}
</style>
</head>
<body>
<header class="top"><div class="wrap bar" id="bar"></div></header>
<main id="app"></main>
<footer>© Sabor Ligero · Uso personal</footer>
<script>
const DATA={"cats": [{"id": "desayunos", "name": "Desayunos", "desc": "Para empezar bien el día"}, {"id": "almuerzos", "name": "Almuerzos", "desc": "Ligeros, completos y llenos de sabor"}, {"id": "meriendas", "name": "Meriendas", "desc": "Dulces y saladas para cuando aparece el hambre"}, {"id": "cenas", "name": "Cenas", "desc": "Prácticas para terminar el día"}], "recipes": [{"id": "mug-cake-de-chocolate", "cat": "desayunos", "name": "Mug Cake de Chocolate", "min": 3, "kcal": 210, "por": 1, "ing": ["2 cdas de harina de avena", "1 cda de cacao en polvo sin azúcar", "1 huevo", "3 cdas de leche descremada", "1 cdta de edulcorante", "1/2 cdta de polvo de hornear", "5 g de chocolate 70% picado"], "steps": ["Mezcla todos los ingredientes en una taza grande hasta obtener una masa lisa.", "Agrega el chocolate picado por encima.", "Lleva al microondas por 90 segundos y deja reposar 1 minuto antes de comer."]}, {"id": "tostadas-proteicas-de-aguacate-y-huevo", "cat": "desayunos", "name": "Tostadas Proteicas de Aguacate y Huevo", "min": 10, "kcal": 165, "por": 1, "ing": ["1 rebanada de pan integral", "1/4 de aguacate", "1 huevo cocido", "3 tomates cherry", "sal, pimienta y hojuelas de chile", "brotes verdes"], "steps": ["Tuesta el pan.", "Aplasta el aguacate con sal y pimienta y úntalo sobre el pan.", "Cubre con el huevo en rodajas, los tomates partidos y los brotes."]}, {"id": "avena-proteica-de-frutos-rojos", "cat": "desayunos", "name": "Avena Proteica de Frutos Rojos", "min": 15, "kcal": 245, "por": 1, "ing": ["40 g de avena en hojuelas", "150 ml de leche descremada", "1 cda de semillas de chía", "80 g de yogur griego natural", "60 g de frutos rojos", "5 almendras picadas"], "steps": ["Mezcla la avena, la leche, la chía y el yogur en un frasco.", "Refrigera al menos 10 minutos o toda la noche.", "Sirve con los frutos rojos y las almendras por encima."]}, {"id": "panqueques-de-chocolate-fit", "cat": "desayunos", "name": "Panqueques de Chocolate Fit", "min": 7, "kcal": 198, "por": 1, "ing": ["1 plátano maduro", "1 huevo", "2 cdas de harina de avena", "1 cda de cacao en polvo", "1/2 cdta de polvo de hornear", "fresas y arándanos para servir"], "steps": ["Tritura el plátano y mézclalo con el huevo, la avena, el cacao y el polvo de hornear.", "Cocina pequeñas porciones en sartén antiadherente 1 a 2 minutos por lado.", "Sirve con las frutas."]}, {"id": "omelette-relleno-de-espinaca-y-queso", "cat": "desayunos", "name": "Omelette Relleno de Espinaca y Queso", "min": 8, "kcal": 185, "por": 1, "ing": ["2 huevos", "1 puñado de espinaca", "30 g de queso fresco light", "2 tomates cherry", "sal y pimienta", "aceite en spray"], "steps": ["Bate los huevos con sal y pimienta.", "Vierte en sartén caliente con un poco de aceite y cocina a fuego medio.", "Agrega la espinaca, el queso y el tomate, dobla y cocina 1 minuto más."]}, {"id": "panqueques-de-avena-y-platano", "cat": "desayunos", "name": "Panqueques de Avena y Plátano", "min": 10, "kcal": 230, "por": 1, "ing": ["1 plátano", "2 claras de huevo", "30 g de avena", "1 pizca de canela", "1 cdta de miel"], "steps": ["Licúa el plátano, las claras, la avena y la canela.", "Cocina porciones pequeñas en sartén antiadherente hasta dorar por ambos lados.", "Sirve con un hilo de miel."]}, {"id": "yogur-con-granola-casera-y-kiwi", "cat": "desayunos", "name": "Yogur con Granola Casera y Kiwi", "min": 5, "kcal": 190, "por": 1, "ing": ["150 g de yogur griego natural", "2 cdas de granola sin azúcar", "1 kiwi en cubos", "1 cdta de semillas de calabaza"], "steps": ["Coloca el yogur en un bol.", "Agrega el kiwi y la granola.", "Termina con las semillas de calabaza."]}, {"id": "huevos-revueltos-con-champinones", "cat": "desayunos", "name": "Huevos Revueltos con Champiñones", "min": 8, "kcal": 175, "por": 1, "ing": ["2 huevos", "4 champiñones laminados", "1/4 de cebolla picada", "perejil", "sal y pimienta"], "steps": ["Saltea la cebolla y los champiñones hasta dorar.", "Agrega los huevos batidos y revuelve a fuego bajo.", "Termina con perejil, sal y pimienta."]}, {"id": "batido-verde-energizante", "cat": "desayunos", "name": "Batido Verde Energizante", "min": 5, "kcal": 160, "por": 1, "ing": ["1 puñado de espinaca", "1/2 manzana verde", "1/2 plátano congelado", "200 ml de agua o leche vegetal", "1 cdta de jengibre rallado", "jugo de 1/2 limón"], "steps": ["Coloca todo en la licuadora.", "Licúa hasta que quede cremoso.", "Sirve de inmediato."]}, {"id": "overnight-oats-de-mango-y-coco", "cat": "desayunos", "name": "Overnight Oats de Mango y Coco", "min": 5, "kcal": 260, "por": 1, "ing": ["40 g de avena", "150 ml de leche de coco light", "1 cda de chía", "70 g de mango en cubos", "1 cda de coco rallado sin azúcar"], "steps": ["Mezcla la avena, la leche y la chía en un frasco.", "Refrigera toda la noche.", "Por la mañana agrega el mango y el coco."]}, {"id": "crepas-de-avena-con-queso-fresco", "cat": "desayunos", "name": "Crepas de Avena con Queso Fresco", "min": 12, "kcal": 220, "por": 1, "ing": ["30 g de avena molida", "1 huevo", "80 ml de leche descremada", "40 g de queso fresco", "orégano"], "steps": ["Licúa la avena, el huevo y la leche.", "Cocina capas finas en sartén antiadherente.", "Rellena con queso fresco y orégano y dobla."]}, {"id": "tostada-de-ricota-y-fresas", "cat": "desayunos", "name": "Tostada de Ricota y Fresas", "min": 5, "kcal": 180, "por": 1, "ing": ["1 rebanada de pan integral", "50 g de ricota light", "4 fresas en láminas", "1 cdta de miel", "menta fresca"], "steps": ["Tuesta el pan.", "Unta la ricota.", "Cubre con fresas, miel y hojas de menta."]}, {"id": "bowl-de-acai-ligero", "cat": "desayunos", "name": "Bowl de Açaí Ligero", "min": 7, "kcal": 240, "por": 1, "ing": ["100 g de pulpa de açaí sin azúcar", "1/2 plátano congelado", "50 ml de leche vegetal", "2 cdas de granola", "frutos rojos"], "steps": ["Licúa el açaí, el plátano y la leche hasta obtener una crema espesa.", "Sirve en un bol.", "Decora con granola y frutos rojos."]}, {"id": "muffins-de-huevo-y-verduras", "cat": "desayunos", "name": "Muffins de Huevo y Verduras", "min": 20, "kcal": 140, "por": 2, "ing": ["4 huevos", "1/2 pimiento rojo picado", "1 puñado de espinaca", "1/4 de cebolla", "30 g de queso rallado light", "sal y pimienta"], "steps": ["Precalienta el horno a 180 °C.", "Bate los huevos con las verduras y el queso y reparte en moldes para muffins.", "Hornea 15 minutos hasta que cuajen."]}, {"id": "arepa-integral-con-huevo", "cat": "desayunos", "name": "Arepa Integral con Huevo", "min": 15, "kcal": 260, "por": 1, "ing": ["50 g de harina de maíz precocida integral", "70 ml de agua tibia", "1 pizca de sal", "1 huevo", "1/4 de aguacate"], "steps": ["Mezcla la harina, el agua y la sal y forma una arepa.", "Cocínala en sartén 5 minutos por lado.", "Ábrela y rellena con huevo revuelto y aguacate."]}, {"id": "chilaquiles-ligeros-al-horno", "cat": "desayunos", "name": "Chilaquiles Ligeros al Horno", "min": 20, "kcal": 280, "por": 1, "ing": ["2 tortillas de maíz en triángulos", "100 ml de salsa verde casera", "1 huevo", "20 g de queso fresco", "cebolla morada", "cilantro"], "steps": ["Hornea los triángulos de tortilla a 200 °C por 8 minutos hasta que estén crujientes.", "Calienta la salsa y baña los totopos.", "Sirve con huevo estrellado, queso, cebolla y cilantro."]}, {"id": "smoothie-de-fresa-y-avena", "cat": "desayunos", "name": "Smoothie de Fresa y Avena", "min": 5, "kcal": 210, "por": 1, "ing": ["6 fresas", "20 g de avena", "150 ml de leche descremada", "50 g de yogur natural", "1 cdta de edulcorante"], "steps": ["Coloca todo en la licuadora.", "Licúa hasta que esté suave.", "Sirve frío."]}, {"id": "pudin-de-chia-y-cacao", "cat": "desayunos", "name": "Pudín de Chía y Cacao", "min": 5, "kcal": 200, "por": 1, "ing": ["2 cdas de semillas de chía", "150 ml de leche de almendras", "1 cda de cacao", "1 cdta de miel", "1/2 plátano"], "steps": ["Mezcla la chía, la leche, el cacao y la miel.", "Refrigera al menos 2 horas.", "Sirve con rodajas de plátano."]}, {"id" steps": ["Saltea la cebolla y el calabacín.", "Agrega los huevos y revuelve.", "Sazona con orégano."]}, {"id": "camarones-al-limon-con-calabacin", "cat": "cenas", "name": "Camarones al Limón con Calabacín", "min": 15, "kcal": 220, "por": 1, "ing": ["130 g de camarones", "2 calabacines en espiral", "ajo", "limón", "perejil", "chile"], "steps": ["Saltea los camarones con ajo y chile.", "Agrega los zoodles 2 minutos.", "Termina con limón y perejil."]}, {"id": "ensalada-de-lentejas-y-huevo", "cat": "cenas", "name": "Ensalada de Lentejas y Huevo", "min": 15, "kcal": 300, "por": 1, "ing": ["100 g de lentejas cocidas", "1 huevo cocido", "tomate", "cebolla", "pimiento", "vinagre y aceite"], "steps": ["Pica las verduras.", "Mezcla con las lentejas.", "Agrega el huevo y aliña."]}, {"id": "pollo-desmenuzado-con-verduras", "cat": "cenas", "name": "Pollo Desmenuzado con Verduras", "min": 20, "kcal": 270, "por": 1, "ing": ["100 g de pollo desmenuzado", "calabacín", "zanahoria", "cebolla", "tomate", "comino"], "steps": ["Sofríe la cebolla y el tomate.", "Agrega las verduras en tiras.", "Incorpora el pollo y sazona con comino."]}, {"id": "crema-de-tomate-asado", "cat": "cenas", "name": "Crema de Tomate Asado", "min": 35, "kcal": 140, "por": 3, "ing": ["8 tomates", "1 cebolla", "4 dientes de ajo", "albahaca", "400 ml de caldo", "1 cda de aceite de oliva"], "steps": ["Asa los tomates, la cebolla y el ajo a 200 °C por 25 minutos.", "Tritura con el caldo y la albahaca.", "Calienta y sirve."]}, {"id": "bacalao-con-pimientos", "cat": "cenas", "name": "Bacalao con Pimientos", "min": 30, "kcal": 270, "por": 2, "ing": ["300 g de bacalao desalado", "2 pimientos", "1 cebolla", "ajo", "tomate", "perejil"], "steps": ["Sofríe la cebolla, el ajo y los pimientos en tiras.", "Agrega el tomate y luego el bacalao.", "Cocina 10 minutos y termina con perejil."]}, {"id": "tortilla-de-avena-y-verduras", "cat": "cenas", "name": "Tortilla de Avena y Verduras", "min": 15, "kcal": 220, "por": 1, "ing": ["2 huevos", "2 cdas de avena", "espinaca", "tomate", "cebolla", "queso fresco"], "steps": ["Bate los huevos con la avena.", "Agrega las verduras picadas.", "Cocina en sartén por ambos lados y sirve con queso."]}]};
const PHOTOS={"cat-desayunos": "img/cat-desayuno.jpg", "cat-almuerzos": "img/cat-almuerzo.jpg", "cat-cenas": "img/cat-cena.jpg", "cat-meriendas": "img/bono-postres.jpg", "mug-cake-de-chocolate": "img/rec-mugcake.jpg", "tostadas-proteicas-de-aguacate-y-huevo": "img/rec-tostadas.jpg", "pizza-rapida-de-sarten": "img/rec-pizza.jpg", "avena-proteica-de-frutos-rojos": "img/rec-avena.jpg", "panqueques-de-chocolate-fit": "img/rec-panqueque.jpg", "omelette-relleno-de-espinaca-y-queso": "img/rec-omelette.jpg", "panqueques-de-avena-y-platano": "img/cat-desayuno.jpg", "pollo-a-la-plancha-con-quinoa-y-ensalada": "img/cat-almuerzo.jpg", "salmon-con-quinoa-y-verduras-salteadas": "img/cat-cena.jpg", "cheesecake-fit-en-vaso": "img/bono-postres.jpg", "overnight-oats-de-mango-y-coco": "img/carrusel.jpg"};
const CAT={};DATA.cats.forEach(c=>CAT[c.id]=c);
const R={};DATA.recipes.forEach(r=>R[r.id]=r);
const store={get(k,d){try{const v=localStorage.getItem('sl_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('sl_'+k,JSON.stringify(v))}catch(e){}}};
let favs=new Set(store.get('favs',[]));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const I={
 clock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 fire:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 01-10 0c0-2 1-3.5 2-4.5.3 1.6 1 2.5 2 2.5 0-3-1-5 1-8z"/></svg>',
 user:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
 back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
 search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
 heart:f=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/></svg>`,
 print:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg>'
};
function bar(back){
 document.getElementById('bar').innerHTML=(back?`<button class="back" aria-label="Volver" onclick="goBack()">${I.back}</button>`:'')+
 `<a href="#/" class="logo">Sabor Ligero<small>+300 RECETAS</small></a><span class="spacer"></span>`+
 `<a href="#/favoritos" class="favbtn" aria-label="Mis favoritas">${I.heart(true)}<span>${favs.size}</span></a>`;
}
function goBack(){ if(history.length>1) history.back(); else location.hash='#/'; }
function thumb(r){ const p=PHOTOS[r.id]; return `<div class="thumb t-${r.cat}">${p?`<img src="${p}" alt="" loading="lazy">`:esc(r.name[0])}</div>`; }
function card(r){
 const f=favs.has(r.id);
 return `<div class="card"><a href="#/receta/${r.id}" style="display:flex;gap:12px;align-items:center;flex:1;min-width:0">${thumb(r)}<div class="info"><b>${esc(r.name)}</b><div class="meta"><span>${I.clock}${r.min} min</span><span>${I.fire}${r.kcal} kcal</span><span>${I.user}${r.por}</span></div></div></a><button class="heart" aria-label="${f?'Quitar de favoritas':'Agregar a favoritas'}" aria-pressed="${f}" onclick="toggleFav('${r.id}')">${I.heart(f)}</button></div>`;
}
function toggleFav(id){ favs.has(id)?favs.delete(id):favs.add(id); store.set('favs',[...favs]); render(); }
let filtro='todas', q='';
const FILTROS=[['todas','Todas'],['rapidas','Hasta 10 min'],['ligeras','Hasta 200 kcal'],['proteina','Con pollo o pescado'],['sinhorno','Sin horno']];
function pasa(r){
 if(filtro==='rapidas') return r.min<=10;
 if(filtro==='ligeras') return r.kcal<=200;
 if(filtro==='proteina'){ const t=norm(r.ing.join(' ')); return /pollo|pescado|salmon|atun|tilapia|merluza|camaron|pavo|bacalao/.test(t); }
 if(filtro==='sinhorno') return !/horno|hornea/.test(norm(r.steps.join(' ')));
 return true;
}
function chips(){ return `<div class="chips" role="group" aria-label="Filtros">${FILTROS.map(([k,l])=>`<button class="chip" aria-pressed="${filtro===k}" onclick="filtro='${k}';render()">${l}</button>`).join('')}</div>`; }
function home(){
 bar(false);
 const counts={};DATA.recipes.forEach(r=>counts[r.cat]=(counts[r.cat]||0)+1);
 let res='';
 if(q.trim()){
  const nq=norm(q.trim());
  const found=DATA.recipes.filter(r=>norm(r.name+' '+r.ing.join(' ')).includes(nq)&&pasa(r));
  res=`<div class="sec"><h2>Resultados</h2><span>${found.length} recetas</span></div>${chips()}<div class="list">${found.map(card).join('')||'<div class="empty">No encontramos recetas con esa búsqueda.</div>'}</div>`;
 }
 const dest=['mug-cake-de-chocolate','tostadas-proteicas-de-aguacate-y-huevo','pizza-rapida-de-sarten','avena-proteica-de-frutos-rojos','panqueques-de-chocolate-fit','omelette-relleno-de-espinaca-y-queso'].map(i=>R[i]).filter(Boolean);
 document.getElementById('app').innerHTML=`
 <section class="hero"><div class="wrap">
  <h1>¿Qué vamos a cocinar hoy?</h1>
  <p>${DATA.recipes.length} recetas ligeras, prácticas y deliciosas.</p>
  <label class="search">${I.search}<input id="q" type="search" placeholder="Busca por receta o ingrediente" value="${esc(q)}" aria-label="Buscar recetas" autocomplete="off"></label>
 </div></section>
 <div class="wrap">
  ${res}
  ${q.trim()?'':`
  <div class="welcome">¡Bienvenida! Guarda esta página en la pantalla de inicio de tu celular para tener tus recetas siempre a mano. Toca el <b>corazón</b> para guardar tus favoritas.</div>
  <div class="sec"><h2>Categorías</h2></div>
  <div class="cats">${DATA.cats.map(c=>`<a class="cat" href="#/categoria/${c.id}"><img src="${PHOTOS['cat-'+c.id]}" alt=""><span class="ov"></span><span class="lbl"><b>${c.name}</b><i>${counts[c.id]} recetas</i></span></a>`).join('')}</div>
  <div class="sec"><h2>Destacadas</h2></div>
  <div class="list">${dest.map(card).join('')}</div>`}
 </div>`;
 const inp=document.getElementById('q');
 inp.addEventListener('input',e=>{q=e.target.value;const pos=e.target.selectionStart;home();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos);});
}
function categoria(id){
 const c=CAT[id]; if(!c) return home();
 bar(true);
 const list=DATA.recipes.filter(r=>r.cat===id&&pasa(r));
 document.getElementById('app').innerHTML=`
 <section class="hero"><div class="wrap"><h1>${c.name}</h1><p style="margin-bottom:0">${c.desc}</p></div></section>
 <div class="wrap"><div class="sec"><h2>Recetas</h2><span>${list.length} recetas</span></div>${chips()}<div class="list">${list.map(card).join('')||'<div class="empty">No hay recetas con este filtro.</div>'}</div></div>`;
}
function favoritos(){
 bar(true);
 const list=[...favs].map(i=>R[i]).filter(Boolean);
 document.getElementById('app').innerHTML=`
 <section class="hero"><div class="wrap"><h1>Mis favoritas</h1><p style="margin-bottom:0">Las recetas que guardaste con el corazón.</p></div></section>
 <div class="wrap"><div class="list" style="margin-top:20px">${list.map(card).join('')||'<div class="empty">Todavía no tienes favoritas. Toca el corazón en cualquier receta para guardarla aquí.</div>'}</div></div>`;
}
function receta(id){
 const r=R[id]; if(!r) return home();
 bar(true);
 const f=favs.has(id), p=PHOTOS[id], checks=store.get('chk_'+id,[]);
 document.getElementById('app').innerHTML=`
 <section class="rhero">${p?`<img class="img" src="${p}" alt="${esc(r.name)}">`:`<div class="noimg t-${r.cat}">${esc(r.name[0])}</div>`}
 <div class="wrap"><span class="tag">${CAT[r.cat].name.toUpperCase()}</span><h1>${esc(r.name)}</h1>
 <div class="stats"><div class="stat"><b>${r.min}</b><span>minutos</span></div><div class="stat"><b>${r.kcal}</b><span>kcal/porción</span></div><div class="stat"><b>${r.por}</b><span>${r.por>1?'porciones':'porción'}</span></div></div></div></section>
 <div class="wrap">
  <div class="actions"><button class="btn" onclick="toggleFav('${id}')" aria-pressed="${f}">${I.heart(f)} ${f?'Guardada':'Guardar'}</button><button class="btn sec2" onclick="window.print()">${I.print} Imprimir</button></div>
  <div class="block"><h2>Ingredientes</h2><ul class="ing">${r.ing.map((x,i)=>`<li><label><input type="checkbox" ${checks.includes(i)?'checked':''} onchange="chk('${id}',${i},this.checked)"><span>${esc(x)}</span></label></li>`).join('')}</ul></div>
  <div class="block"><h2>Preparación</h2><ol class="steps">${r.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol></div>
  <p class="note">Las calorías son aproximadas por porción y pueden variar según las marcas y cantidades que uses.</p>
 </div>`;

}
function chk(id,i,on){ let a=store.get('chk_'+id,[]); a=a.filter(x=>x!==i); if(on)a.push(i); store.set('chk_'+id,a); }
function render(){
 const h=location.hash.replace(/^#\/?/,'').split('/');
 if(h[0]==='categoria') categoria(h[1]);
 else if(h[0]==='receta') receta(h[1]);
 else if(h[0]==='favoritos') favoritos();
 else home();
}
let lastHash=location.hash;
window.addEventListener('hashchange',()=>{ if(!location.hash.startsWith('#/receta')) filtro=filtro; render(); window.scrollTo(0,0); });
render();
</script>
</body>
